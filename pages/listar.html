<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista de Convidados</title>
</head>
<body>
  <h1>Convidados Confirmados</h1>
  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Presença</th>
      </tr>
    </thead>
    <tbody id="tabela-convidados"></tbody>
  </table>

  <script>
    async function carregarConvidados() {
      const resposta = await fetch('/api/listar');
      const dados = await resposta.json();

      const tbody = document.getElementById('tabela-convidados');
      tbody.innerHTML = '';

      dados.convidados.forEach(c => {
        const linha = `<tr>
          <td>${c.nome}</td>
          <td>${c.telefone}</td>
          <td>${c.presenca ? 'Confirmado' : 'Não confirmado'}</td>
        </tr>`;
        tbody.innerHTML += linha;
      });
    }

    carregarConvidados();
  </script>
</body>
</html>
